<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Планировщик</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F8FA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F141A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Планировщик" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Применяем тему до отрисовки, чтобы не было вспышки светлой темы
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
